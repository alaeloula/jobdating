# Services de développement local uniquement (option B, docs/DECISIONS.md).
# Le site tourne avec PHP sous Windows ; Docker fournit MySQL 8 et Mailpit. Les tests et outils
# du backend se lancent dans le service « php » (PHP 8.4) : docker compose run --rm php php artisan test
# Démarrer : docker compose up -d   ·   Arrêter : docker compose down
# Ne pas utiliser en production : les identifiants ci-dessous sont des valeurs locales.

name: jobdating

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jobdating
      MYSQL_USER: jobdating
      MYSQL_PASSWORD: jobdating
      TZ: Africa/Casablanca
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Déclencheurs du journal d'audit (T-06) créés par l'utilisateur applicatif, sans droit SUPER,
      # alors que la journalisation binaire est active (sinon erreur 1419).
      - --log-bin-trust-function-creators=1
    ports:
      # 3307 côté poste pour ne pas entrer en conflit avec un MySQL déjà installé.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # PHP 8.4 pour les tests et outils du backend (ENV-01), à côté de MySQL : pas de délai réseau
  # Windows ↔ Docker. Ne démarre pas avec « up » (profil « outils ») ; s'utilise ainsi :
  #   docker compose run --rm php php artisan test
  php:
    build: ./docker/php
    profiles: ["outils"]
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      # Prioritaires sur backend/.env et phpunit.xml : MySQL est joint par le réseau Docker.
      DB_HOST: mysql
      DB_PORT: 3306
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP utilisé par Laravel
      - "8025:8025"   # Interface web : http://localhost:8025

volumes:
  mysql-data:
